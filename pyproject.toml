[project]
name = "grafo-coloracao-anatel"
version = "0.1.0"
description = "Alocação de canais entre ERBs da região de Bauru-SP via coloração de grafos (dados ANATEL)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.20.0",
    "networkx>=3.6.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
